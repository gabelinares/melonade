<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issues · Option A (Graphite)</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The session avatars (DiceBear pixelbot). Measured: twelve avatars on a
         cold cache took 2-4s to appear, and most of that was one TLS handshake
         nothing had asked for yet. Warming it here is one line and the rows
         fill in as they paint. See shared/avatar.ts. -->
    <link rel="preconnect" href="https://api.dicebear.com" crossorigin />
    <!-- Every face the prototype panel's five type pairings can ask for. The
         System pairing asks for nothing: it is the OS's own stack. This
         DECLARES them; a browser does not fetch a face until something is
         painted in it, so the provider also asks for each pairing's four roles
         on mount. Without that, the first switch paints the fallback for a beat
         and reads as the control doing nothing rather than as a font loading. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400..600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
