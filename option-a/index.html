         a browser does not fetch a face until something is painted in it, so the
         provider also asks for all three on mount. Without that, the first
         switch paints the fallback for a beat and reads as the control doing
         nothing rather than as a font loading. -->

      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"

    />
